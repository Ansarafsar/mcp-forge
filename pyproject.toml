[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-forge"
version = "0.1.0"
description = "Compile a single YAML spec into a runnable Model Context Protocol (MCP) server."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ansar Afsar", email = "ansarafsar001@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "codegen", "yaml", "llm", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
# Needed only to *run* a generated server, not to build one.
serve = ["mcp>=1.2.0"]
dev = ["pytest>=8.0", "mcp>=1.2.0"]
docs = ["mkdocs-material>=9.5"]

[project.urls]
Homepage = "https://github.com/Ansarafsar/mcp-forge"
Repository = "https://github.com/Ansarafsar/mcp-forge"
Issues = "https://github.com/Ansarafsar/mcp-forge/issues"

[project.scripts]
mcp-forge = "mcp_forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_forge = ["templates/*.j2", "templates/specs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
